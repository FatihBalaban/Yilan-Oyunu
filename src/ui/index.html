<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BGT132 - Final Projesi Yılan Oyunu</title>
    <style>
        body { display: flex; flex-direction: column; align-items: center; background-color: #2c3e50; color: white; font-family: sans-serif; margin: 0; padding-top: 30px; }
        #scoreContainer { text-align: center; margin-bottom: 15px; }
        #scoreBoard { font-size: 36px; font-weight: bold; color: #ecf0f1; margin: 0; }
        #highScoreBoard { font-size: 18px; color: #f1c40f; margin-top: 5px; font-weight: bold; }
        .game-container { position: relative; border-radius: 10px; overflow: hidden; border: 10px solid #578a34; }
        canvas { background-color: #a2d149; display: block; }
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; z-index: 10; }
        h1 { color: #f1c40f; font-size: 38px; margin: 0 0 20px 0; }
        .difficulty-selector { display: flex; gap: 10px; margin-bottom: 30px; }
        .diff-btn { background-color: #34495e; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .diff-btn.active { background-color: #2ecc71; }
        #gameOverScreen { display: none; }
        h2 { color: #e74c3c; font-size: 40px; margin: 0; }
        #finalScoreText { font-size: 24px; margin: 15px 0 25px 0; }
        .action-buttons { display: flex; gap: 15px; }
        button { padding: 10px 20px; font-size: 16px; font-weight: bold; border-radius: 20px; cursor: pointer; border: none; color: white; }
        .primary-btn { background-color: #3498db; }
        .secondary-btn { background-color: #95a5a6; }
    </style>
</head>
<body>

    <div id="scoreContainer">
        <div id="scoreBoard">Skor: <span id="scoreValue">0</span></div>
        <div id="highScoreBoard">🏆 Rekor: <span id="highScoreValue">0</span></div>
    </div>
    
    <div class="game-container">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        
        <div id="startScreen" class="overlay">
            <h1>YILAN OYUNU</h1>
            <div class="difficulty-selector">
                <button class="diff-btn" data-speed="150">Kolay</button>
                <button class="diff-btn active" data-speed="100">Normal</button>
                <button class="diff-btn" data-speed="65">Zor</button>
            </div>
            <button id="startBtn" class="primary-btn">Oyuna Başla</button>
        </div>

        <div id="gameOverScreen" class="overlay">
            <h2>OYUN BİTTİ!</h2>
            <div id="finalScoreText">Skorun: 0</div>
            <div class="action-buttons">
                <button id="restartBtn" class="primary-btn">Tekrar Oyna</button>
                <button id="menuBtn" class="secondary-btn">Ana Menü</button>
            </div>
        </div>
    </div>

    <!-- type="module" kullanılarak kodların dışarıdan modüler olarak alınması sağlandı -->
    <script type="module" src="../services/GameManager.js"></script>
</body>
</html>
